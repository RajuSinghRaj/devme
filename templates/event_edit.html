<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Edit entry ? DevTrack</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="page"><header class="topbar"><a class="brand" href="/">DEVTRACK<span>.</span></a><a class="caption" href="{{ url_for('event_detail', event_id=event.id) }}">CANCEL</a></header><section class="activity"><h1>Edit entry</h1>{% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}<form class="entry-form" method="post"><label for="title">Title</label><input id="title" name="title" maxlength="120" value="{{ event.title }}" required><label for="details">Details</label><textarea id="details" name="details" maxlength="2000">{{ event.details }}</textarea><label for="category">Category</label><input id="category" name="category" maxlength="40" value="{{ event.category }}"><label for="severity">Severity</label><select id="severity" name="severity"><option value="low" {% if event.severity == 'low' %}selected{% endif %}>Low</option><option value="normal" {% if event.severity == 'normal' %}selected{% endif %}>Normal</option><option value="high" {% if event.severity == 'high' %}selected{% endif %}>High</option></select><button type="submit">Save changes</button></form></section></main></body></html>
