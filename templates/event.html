<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ event.title }} ? DevTrack</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><main class="page"><header class="topbar"><a class="brand" href="/">DEVTRACK<span>.</span></a><a class="caption" href="/">BACK TO DASHBOARD</a></header><article class="event-detail"><p class="eyebrow">{{ event.category|upper }} ? {{ event.severity|upper }}</p><h1>{{ event.title }}</h1><time datetime="{{ event.created_at }}">{{ event.created_at }}</time><div class="event-body">{{ event.details }}</div><div class="event-actions"><a class="new-entry" href="{{ url_for('edit_event_page', event_id=event.id) }}">Edit entry</a><form method="post" action="{{ url_for('delete_event_page', event_id=event.id) }}" onsubmit="return confirm('Delete this entry?')"><button class="delete-entry" type="submit">Delete entry</button></form></div></article></main></body></html>
